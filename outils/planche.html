<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Shinka — planche des espèces</title>
  <!-- Outil de contrôle : toutes les vignettes du carnet (models/<id>.png) sur une planche,
       avec le nom et la rareté. Capture : node outils/capture.mjs "http://localhost:8792/outils/planche.html" planche.png 3 1500 1000 -->
  <style>
    body { margin: 0; padding: 24px; background: #0b1a26; color: #d9ecf5; font: 14px/1.4 Inter, system-ui, sans-serif; }
    h1 { font: 300 22px/1 'Cormorant Garamond', Georgia, serif; letter-spacing: .2em; margin: 0 0 18px; }
    .grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }
    figure { margin: 0; background: #122535; border: 1px solid rgba(217, 236, 245, .12); border-radius: 10px; overflow: hidden; }
    img { display: block; width: 100%; aspect-ratio: 1; object-fit: contain; background: linear-gradient(#183246, #0e2231); }
    figcaption { padding: 8px 12px; display: flex; justify-content: space-between; }
    .rarete { opacity: .6; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
  </style>
</head>
<body>
  <h1>SHINKA · 9 espèces</h1>
  <div class="grille" id="grille"></div>
  <script type="module">
    import { ESPECES } from '../js/species.js';
    const grille = document.getElementById('grille');
    for (const e of ESPECES) {
      const f = document.createElement('figure');
      const img = document.createElement('img'); img.src = `../models/${e.id}.png?${Date.now()}`;
      const cap = document.createElement('figcaption');
      cap.append(Object.assign(document.createElement('span'), { textContent: e.nom }),
                 Object.assign(document.createElement('span'), { className: 'rarete', textContent: `${e.rarete} · ${e.taille} m` }));
      f.append(img, cap); grille.append(f);
    }
  </script>
</body>
</html>
